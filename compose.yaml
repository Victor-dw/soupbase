services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: soupbase
      POSTGRES_USER: soupbase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U soupbase]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build:
      context: .
      target: migrate
      args:
        NEXT_PUBLIC_REPOSITORY_URL: ${NEXT_PUBLIC_REPOSITORY_URL:-}
    environment:
      DATABASE_URL: postgresql://soupbase:${POSTGRES_PASSWORD}@db:5432/soupbase
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'npm run db:migrate && npm run content:sync']
    restart: 'no'
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_REPOSITORY_URL: ${NEXT_PUBLIC_REPOSITORY_URL:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://soupbase:${POSTGRES_PASSWORD}@db:5432/soupbase
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      AI_ACCESS_MODE: ${AI_ACCESS_MODE:-byok_only}
      UPLOADS_ENABLED: ${UPLOADS_ENABLED:-true}
      JEV_MODEL: ${JEV_MODEL:-typesafe-ai/jev}
      ENABLE_GUESS: ${ENABLE_GUESS:-true}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      NEXT_PUBLIC_REPOSITORY_URL: ${NEXT_PUBLIC_REPOSITORY_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  postgres:
  caddy_data:
  caddy_config:
